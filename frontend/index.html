<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retryx</title>
    <meta
      name="description"
      content="Retryx delivers your events to registered URLs and keeps trying until they arrive."
    />

    <!--
      IBM Plex Sans for the interface, IBM Plex Mono for machine values only — ids, hex
      signatures, status codes, JSON. The Plex family ships genuine tabular figures, which
      dense numeric columns need if they are going to line up.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme is applied before first paint so a reload never flashes the wrong one. -->
    <script>
      try {
        const stored = localStorage.getItem('retryx.theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored
        }
      } catch {
        /* private browsing with storage disabled — keep the default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
