# ============================================================================
#  nginx config for the Retryx dashboard
# ============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard is a single-page app with client-side routing. Without this,
    # a reload on /deliveries/7a1c… asks nginx for a file that does not exist and
    # gets a 404 — the classic SPA deployment bug. Serve index.html and let the
    # router read the URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable by construction, so they can be
    # cached hard. index.html must not be, or a deploy leaves browsers holding a
    # stale document that references deleted bundles.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Same-origin proxy to the API, so the browser never makes a cross-origin
    # request and CORS is not in the picture in production at all.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
